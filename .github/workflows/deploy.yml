name: 부동산·대출·복비 계산기 자동 배포

on:
  schedule:
    - cron: '10 22 * * *' # 매일 07:10 KST
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: IndexNow Ping
        continue-on-error: true
        run: |
          python3 -c "
          import json, urllib.request
          key = 'c4e819a2f7b043d691e5a8c320f4b712'
          payload = json.dumps({'host':'0520goeus.github.io','key':key,'keyLocation':'https://0520goeus.github.io/house-calc-kr/'+key+'.txt','urlList':['https://0520goeus.github.io/house-calc-kr/']}).encode()
          urllib.request.urlopen(urllib.request.Request('https://api.indexnow.org/indexnow', data=payload, headers={'Content-Type':'application/json'}), timeout=10)
          "
